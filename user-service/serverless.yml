# "service" is the name of this project. This will also be added to your AWS resource names.
service: user-service

useDotenv: true

provider:
        name: aws
        runtime: nodejs20.x
        timeout: 30
        versionFunctions: false
        stage: dev
        region: us-east-1
        httpApi:
                cors: true
        environment:
                # This maps the local .env value to the Lambda environment
                accountSid: ${env:accountSid}
                authToken: ${env:authToken}
                APP_SECRET: ${env:APP_SECRET}
                host: ${env:host}
                user: ${env:user}
                database: ${env:database}
                password: ${env:password}
                port: ${env:port}
                SNS_TOPIC: { Ref: CustomerTopic }
        iamRoleStatements:
              - Effect: "Allow"
                Action:
                      - "sns:Publish"
                Resource:
                      - Ref: CustomerTopic

custom:
        stage: "dev"
        serverless-offline:
                httpPort: 3001

functions:
        signup:
                handler: app/handler.Signup
                events:
                      - httpApi:
                                path: /signup
                                method: post
        login:
                handler: app/handler.Login
                events:
                      - httpApi:
                                path: /login
                                method: post
        verify:
                handler: app/handler.Verify
                events:
                      - httpApi:
                                path: /verify
                                method: post
        get-verification-code:
                handler: app/handler.GetVerificationCode
                events:
                      - httpApi:
                                path: /verify
                                method: get
        create-profile:
                handler: app/handler.CreateProfile
                events:
                      - httpApi:
                                path: /user
                                method: post
        edit-profile:
                handler: app/handler.EditProfile
                events:
                      - httpApi:
                                path: /user/{id}
                                method: put
        get-profile:
                handler: app/handler.GetProfile
                events:
                      - httpApi:
                                path: /user
                                method: get
        create-cart:
                handler: app/handler.CreateCart
                events:
                      - httpApi:
                                path: /cart
                                method: post
        edit-cart:
                handler: app/handler.EditCart
                events:
                      - httpApi:
                                path: /cart/{id}
                                method: put
        get-cart:
                handler: app/handler.GetCart
                events:
                      - httpApi:
                                path: /cart
                                method: get
        delete-cart:
                handler: app/handler.DeleteCart
                events:
                      - httpApi:
                                path: /cart/{id}
                                method: delete
        create-payment:
                handler: app/handler.CreatePayment
                events:
                      - httpApi:
                                path: /payment
                                method: post
        edit-payment:
                handler: app/handler.EditPayment
                events:
                      - httpApi:
                                path: /payment
                                method: put
        get-payment:
                handler: app/handler.EditPayment
                events:
                      - httpApi:
                                path: /payment
                                method: get
        order:
                handler: app/handler.CollectPayment
                events:
                      - httpApi:
                                path: /place-order
                                method: post

plugins:
      - serverless-offline

package:
        individually: true

resources:
        Resources:
                CustomerTopic:
                        Type: AWS::SNS::Topic
                        Properties:
                                DisplayName: "Customer SNS Topic description"
                                TopicName: CustomerTopic
        # Output the SNS Topic ARN  - for later use
        Outputs:
                CustomerTopicInfo:
                        Description: customer-topic
                        Value:
                                Ref: CustomerTopic
                        Export:
                                Name: customer-topic
