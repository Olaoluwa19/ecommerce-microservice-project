# "service" is the name of this project. This will also be added to your AWS resource names.
service: user-service

provider:
        name: aws
        runtime: nodejs20.x
        timeout: 30
        versionFunctions: false
        stage: dev
        region: us-east-1
        httpApi:
                cors: true
        environment:
                # This maps the local .env value to the Lambda environment
                accountSid: ${env:accountSid}
                authToken: ${env:authToken}
                APP_SECRET: ${env:APP_SECRET}
                host: ${env:host}
                user: ${env:user}
                database: ${env:database}
                password: ${env:password}
                port: ${env:port}
                SNS_TOPIC: { Ref: CustomerTopic }
        iamRoleStatements:
              - Effect: "Allow"
                Action:
                      - "sns:Publish"
                Resource:
                      - Ref: CustomerTopic

custom:
        stage: "dev"
        serverless-offline:
                httpPort: 3001

functions:
        signup:
                handler: app/handler.Signup
                events:
                      - httpApi:
                                path: /signup
                                method: post
        login:
                handler: app/handler.Login
                events:
                      - httpApi:
                                path: /login
                                method: post
        verify:
                handler: app/handler.Verify
                events:
                      - httpApi:
                                path: /verify
                                method: get
                      - httpApi:
                                path: /verify
                                method: post
        profile:
                handler: app/handler.Profile
                events:
                      - httpApi:
                                path: /user
                                method: post
                      - httpApi:
                                path: /user
                                method: put
                      - httpApi:
                                path: /user
                                method: get
        cart:
                handler: app/handler.Cart
                events:
                      - httpApi:
                                path: /cart
                                method: post
                      - httpApi:
                                path: /cart/{id}
                                method: put
                      - httpApi:
                                path: /cart
                                method: get
                      - httpApi:
                                path: /cart/{id}
                                method: delete
        payment:
                handler: app/handler.Payment
                events:
                      - httpApi:
                                path: /payment
                                method: post
                      - httpApi:
                                path: /payment
                                method: put
                      - httpApi:
                                path: /payment
                                method: get

        order:
                handler: app/handler.CollectPayment
                events:
                      - httpApi:
                                path: /place-order
                                method: post

plugins:
      - serverless-offline

resources:
        Resources:
                CustomerTopic:
                        Type: AWS::SNS::Topic
                        Properties:
                                DisplayName: "Customer SNS Topic description"
                                TopicName: CustomerTopic
        # Output the SNS Topic ARN  - for later use
        Outputs:
                CustomerTopicInfo:
                        Description: customer-topic
                        Value:
                                Ref: CustomerTopic
                        Export:
                                Name: customer-topic
